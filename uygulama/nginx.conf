server {
    listen 8000;
    server_name localhost;

    # İstemciden gelen güvenlik başlıklarını temizle (spoofing engelleme)
    proxy_set_header X-Kullanici-Id "";
    proxy_set_header X-Rol "";
    proxy_set_header X-Ic-Anahtar "";

    # Host ve IP başlıklarını ilet
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. Gateway Sağlık Kontrolü
    location = /api/health {
        default_type application/json;
        return 200 '{"durum":"ok"}';
    }

    # 2. Dışarıdan /internal/ yollarına erişimi kesinlikle engelle
    location /internal/ {
        default_type application/json;
        return 404 '{"hata":"Bulunamadı"}';
    }

    # 3. Korumalı Kimlik Doğrulama Testi (/api/auth/me)
    location = /api/auth/me {
        auth_request /_auth_dogrula;
        auth_request_set $auth_user_id $upstream_http_x_kullanici_id;
        auth_request_set $auth_rol $upstream_http_x_rol;

        proxy_set_header X-Kullanici-Id $auth_user_id;
        proxy_set_header X-Rol $auth_rol;
        proxy_pass http://auth-servisi:8000;
    }

    # 4. Auth Servisi Giriş / Çıkış & Alerjenler
    location = /api/auth/allergens {
        auth_request /_auth_dogrula;
        auth_request_set $auth_user_id $upstream_http_x_kullanici_id;
        auth_request_set $auth_rol $upstream_http_x_rol;

        proxy_set_header X-Kullanici-Id $auth_user_id;
        proxy_set_header X-Rol $auth_rol;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://auth-servisi:8000;
    }

    location /api/allergens {
        auth_request /_auth_dogrula_istege_bagli;
        auth_request_set $auth_user_id $upstream_http_x_kullanici_id;
        auth_request_set $auth_rol $upstream_http_x_rol;

        proxy_set_header X-Kullanici-Id $auth_user_id;
        proxy_set_header X-Rol $auth_rol;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://auth-servisi:8000;
    }

    location /api/auth/ {
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://auth-servisi:8000;
    }

    # 5. Menü Servisi Uç Noktaları (İsteğe bağlı yetkilendirme ile rol bazlı fiyat)
    location /api/menus/ {
        auth_request /_auth_dogrula_istege_bagli;
        auth_request_set $auth_user_id $upstream_http_x_kullanici_id;
        auth_request_set $auth_rol $upstream_http_x_rol;

        proxy_set_header X-Kullanici-Id $auth_user_id;
        proxy_set_header X-Rol $auth_rol;
        proxy_pass http://menu-servisi:8000;
    }

    location /api/cafeterias {
        proxy_pass http://menu-servisi:8000;
    }

    location /api/meals {
        proxy_pass http://menu-servisi:8000;
    }

    # 6. Rezervasyon & Bakiye Servisi (Zorunlu yetkilendirme)
    location /api/reservations {
        auth_request /_auth_dogrula;
        auth_request_set $auth_user_id $upstream_http_x_kullanici_id;
        auth_request_set $auth_rol $upstream_http_x_rol;

        proxy_set_header X-Kullanici-Id $auth_user_id;
        proxy_set_header X-Rol $auth_rol;
        proxy_pass http://rezervasyon-servisi:8000;
    }

    location /api/balance {
        auth_request /_auth_dogrula;
        auth_request_set $auth_user_id $upstream_http_x_kullanici_id;
        auth_request_set $auth_rol $upstream_http_x_rol;

        proxy_set_header X-Kullanici-Id $auth_user_id;
        proxy_set_header X-Rol $auth_rol;
        proxy_pass http://rezervasyon-servisi:8000;
    }

    # 7. Değerlendirme Servisi
    location /api/reviews {
        auth_request /_auth_dogrula_istege_bagli;
        auth_request_set $auth_user_id $upstream_http_x_kullanici_id;
        auth_request_set $auth_rol $upstream_http_x_rol;

        proxy_set_header X-Kullanici-Id $auth_user_id;
        proxy_set_header X-Rol $auth_rol;
        proxy_pass http://degerlendirme-servisi:8000;
    }

    # 8. Yönetim Paneli
    location /api/admin/ {
        auth_request /_auth_dogrula;
        auth_request_set $auth_user_id $upstream_http_x_kullanici_id;
        auth_request_set $auth_rol $upstream_http_x_rol;

        proxy_set_header X-Kullanici-Id $auth_user_id;
        proxy_set_header X-Rol $auth_rol;
        proxy_pass http://menu-servisi:8000;
    }


    # Dahili Doğrulama Ucu (auth_request alt isteği)
    location = /_auth_dogrula {
        internal;
        proxy_pass http://auth-servisi:8000/internal/dogrula;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_method GET;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Ic-Anahtar "yemekhane_ic_gizli_anahtar_2026";
    }

    # İsteğe Bağlı Dahili Doğrulama Ucu
    location = /_auth_dogrula_istege_bagli {
        internal;
        proxy_pass http://auth-servisi:8000/internal/dogrula-istege-bagli;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_method GET;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Ic-Anahtar "yemekhane_ic_gizli_anahtar_2026";
    }


    # 401 & 403 Hata Formatları JSON
    error_page 401 = @hata_401;
    location @hata_401 {
        default_type application/json;
        return 401 '{"detail":"Oturum geçersiz veya süresi dolmuş."}';
    }

    error_page 403 = @hata_403;
    location @hata_403 {
        default_type application/json;
        return 403 '{"detail":"Bu işlem için yetkiniz bulunmamaktadır."}';
    }

    error_page 500 502 503 504 = @hata_50x;
    location @hata_50x {
        default_type application/json;
        return 502 '{"hata":"Servis geçici olarak yanıt veremedi. Lütfen tekrar deneyin."}';
    }
}
